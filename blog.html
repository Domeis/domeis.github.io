<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/symbol_bloodred.svg" type="image/icon type">

    <title>Blog — Whani Kim</title>

    <style>
        /* Force crisp, solid white background matching project pages */
        html, body {
            min-height: 100vh;
            background-color: #ffffff !important;
            background: #ffffff !important;
            color: #191f28;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Clean dark navigation typography */
        .logo, 
        .nav_links li a {
            color: #191f28 !important;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .logo:hover,
        .nav_links li a:hover {
            color: #2563eb !important;
        }

        .burger div {
            background-color: #191f28 !important;
        }

        /* Centered Under Construction Container */
        #construction-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 24px 80px 24px;
            text-align: center;
        }

        .construction-content {
            max-width: 580px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Status Badge with Live Pulse */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #f8fafc;
            color: #475569;
            font-family: "Inter", sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            letter-spacing: 0.3px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f59e0b;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            animation: badgePulse 2s infinite ease-in-out;
        }

        @keyframes badgePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
                transform: scale(0.95);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(245, 158, 11, 0);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
                transform: scale(0.95);
            }
        }

        .construction-title {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 16px;
        }

        .construction-desc {
            font-size: 1.05rem;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* Action Buttons */
        .action-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #0f172a;
            color: #ffffff !important;
            font-size: 0.92rem;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
        }

        .back-home-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .projects-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: #334155 !important;
            font-size: 0.92rem;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 999px;
            text-decoration: none;
            border: 1px solid #cbd5e1;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        .projects-btn:hover {
            border-color: #0f172a;
            color: #0f172a !important;
            transform: translateY(-2px);
        }

        /* Compact Footer */
        footer {
            padding: 24px 8%;
            background-color: #ffffff !important;
            color: #94a3b8;
            font-size: 0.8rem;
            text-align: center;
            border-top: 1px solid #f1f5f9;
        }

        /* Mobile drawer contrast fix */
        @media screen and (max-width: 820px) {
            .nav-active li a {
                color: #eeeeee !important;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <a href="index.html" class="logo">Whani Kim</a>
            <ul class="nav_links">
                <li><a href="index.html#about">Home</a></li>
                <li><a href="index.html#home">Phase</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <!-- Under Construction Stage -->
    <main id="construction-page">
        <div class="construction-content">

            <h1 class="construction-title">Under Construction</h1>

            <p class="construction-desc">
                Check back soon for more personal thoughts and memories.
            </p>

            <div class="action-group">
                <a href="index.html" class="back-home-btn">&larr; Return to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Whani Kim. All rights reserved.</p>
    </footer>

    <!-- GSAP & App Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
